<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UNO League">
  <title>UNO League</title>
  <!--
    Une seule encre, héritée du texte autour (`currentColor`) : broderie,
    tampon, gravure sur une coupe, télécopie d'une commune.
    
    Le U est **évidé** dans l'écusson plutôt que posé dessus. Posé, il
    disparaîtrait : deux formes de la même couleur, l'une sur l'autre, ne font
    qu'une tache. Évidé, il laisse voir le support, et c'est lui qui dessine
    la lettre.
  -->
  <mask id="uno-u">
    <rect width="64" height="64" fill="#fff"/>
    <path d="M21 18v14a11 11 0 0 0 22 0V18" fill="none" stroke="#000"
          stroke-width="7.5" stroke-linecap="round"/>
  </mask>
  <path d="M32 5 56 12.5V32c0 13.6-10.2 22.4-24 27C18.2 54.4 8 45.6 8 32V12.5Z"
        fill="currentColor" mask="url(#uno-u)"/>
</svg>
