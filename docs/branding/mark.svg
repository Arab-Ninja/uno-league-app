<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UNO League">
  <title>UNO League</title>
  <!--
    L'écusson : la forme que porte toute ligue de football, et la seule des
    pistes essayées qui reste lisible à vingt-quatre pixels comme en broderie
    monochrome.

    Le fond est plein plutôt que transparent : posé sur une photo ou sur un
    maillot clair, un écusson évidé laisse le U se perdre dans ce qu'il y a
    derrière.
  -->
  <path d="M32 5 56 12.5V32c0 13.6-10.2 22.4-24 27C18.2 54.4 8 45.6 8 32V12.5Z"
        fill="#0F172A" stroke="#F97316" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M21 18v14a11 11 0 0 0 22 0V18" fill="none" stroke="#fff"
        stroke-width="7.5" stroke-linecap="round"/>
</svg>
