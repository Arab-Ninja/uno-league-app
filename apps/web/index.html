<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="UNO League — ligue amateur de futsal : sessions, classements, points UNO et boutique."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- La police des cartes joueur est embarquée (voir styles.css) : une
         dépendance réseau serait un point de défaillance dans l'application
         empaquetée, hors ligne comme en zone de mauvaise couverture. -->
    <link
      rel="preload"
      href="/fonts/roboto-condensed-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>UNO League</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
